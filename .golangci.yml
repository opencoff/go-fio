# golangci-lint v1 config.
#
# go-check.sh invokes `github.com/golangci/golangci-lint/cmd/golangci-lint@latest`,
# which is the v1 module path and stays at v1.64.x. To upgrade to v2,
# the script would need the `/v2/...` module path. Until then, this
# file uses v1 syntax.

issues:
  # Skip generated protobuf code — `internal/pb` is regenerated by
  # `scripts/gen-proto.sh` and any hand-edits would be clobbered.
  exclude-dirs:
    - internal/pb

  # Belt-and-braces: also match by file pattern so any file with a
  # ".pb.go" suffix is skipped, even if moved.
  exclude-rules:
    - path: \.pb\.go$
      linters:
        - errcheck
        - gosimple
        - govet
        - ineffassign
        - staticcheck
        - unused
