version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - rowserrcheck
    - sqlclosecheck
    - nilerr
    - noctx
    - contextcheck
    - misspell
    - unconvert
    - unparam
    - prealloc
    - gocritic
    - revive
    - gosec

  settings:
    gosec:
      excludes:
        - G115 # integer overflow — bounds enforced by upstream invariants in crypto/IO paths
    misspell:
      ignore-rules:
        # legitimate filesystem term; misspell flags it as "hardline"
        - hardlinked
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - govet
          - ineffassign
          - staticcheck
          - unused
        path: \.pb\.go$
      # Allow stdlib-style Uid/Lhs/Rhs spellings; syscall.Stat_t and
      # os/user.User spell these without all-caps, and we follow suit.
      - linters: [revive]
        text: 'var-naming: (struct field|const) \w*(Uid|Lhs|Rhs) should be'
    paths:
      - internal/pb
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
